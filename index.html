<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World 3D</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#loading{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    color:#00ff88;
    font-size:28px;
    letter-spacing:3px;
    z-index:1000;
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    z-index:100;
    font-size:18px;
}
</style>

<script type="importmap">
{
    "imports": {
        "three":"https://unpkg.com/three@0.167.1/build/three.module.js"
    }
}
</script>

</head>

<body>

<div id="loading">
Loading World...
</div>

<div id="hud">
🌍 Open World
</div>

<script type="module">

import * as THREE from "three";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;

document.body.appendChild(renderer.domElement);

// =========================
// الإضاءة
// =========================

const ambientLight = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(120, 200, 100);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
scene.add(sun);

// =========================
// الضباب
// =========================

scene.fog = new THREE.Fog(0x87ceeb, 80, 450);

// =========================
// الأرض
// =========================

const groundGeometry = new THREE.PlaneGeometry(1000, 1000);
const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x3f9b3f });
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// =========================
// اللاعب
// =========================

const player = new THREE.Mesh(
    new THREE.BoxGeometry(2, 4, 2),
    new THREE.MeshStandardMaterial({ color: 0x2196f3 })
);
player.position.y = 2;
player.castShadow = true;
scene.add(player);

// =========================
// الكاميرا
// =========================

camera.position.set(0, 8, 15);
camera.lookAt(player.position);

function updateCamera(){
    camera.position.x = player.position.x;
    camera.position.z = player.position.z + 15;
    camera.position.y = player.position.y + 8;
    camera.lookAt(player.position);
}

// =========================
// متغيرات الحركة
// =========================

const keys = {
    forward: false,
    backward: false,
    left: false,
    right: false
};

let speed = 0.25;

window.addEventListener("keydown", (e) => {
    if(e.key === "w" || e.key === "ArrowUp") keys.forward = true;
    if(e.key === "s" || e.key === "ArrowDown") keys.backward = true;
    if(e.key === "a" || e.key === "ArrowLeft") keys.left = true;
    if(e.key === "d" || e.key === "ArrowRight") keys.right = true;
});

window.addEventListener("keyup", (e) => {
    if(e.key === "w" || e.key === "ArrowUp") keys.forward = false;
    if(e.key === "s" || e.key === "ArrowDown") keys.backward = false;
    if(e.key === "a" || e.key === "ArrowLeft") keys.left = false;
    if(e.key === "d" || e.key === "ArrowRight") keys.right = false;
});

// =========================
// أشجار تلقائية
// =========================

function createTree(x, z){
    const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.6, 3, 8),
        new THREE.MeshStandardMaterial({ color: 0x7b4a12 })
    );
    trunk.position.set(x, 1.5, z);
    trunk.castShadow = true;
    scene.add(trunk);

    const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(2, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x228B22 })
    );
    leaves.position.set(x, 4.5, z);
    leaves.castShadow = true;
    scene.add(leaves);
}

for(let i = 0; i < 120; i++){
    const x = (Math.random() - 0.5) * 900;
    const z = (Math.random() - 0.5) * 900;
    createTree(x, z);
}

// =========================
// صخور
// =========================

for(let i = 0; i < 80; i++){
    const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(Math.random() * 1.5 + 0.5),
        new THREE.MeshStandardMaterial({ color: 0x888888 })
    );
    rock.position.set(
        (Math.random() - 0.5) * 900,
        1,
        (Math.random() - 0.5) * 900
    );
    rock.castShadow = true;
    scene.add(rock);
}

// =========================
// التحكم بحركة الهاتف
// =========================

let gyroEnabled = false;

function enableGyroscope(){
    if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
        DeviceOrientationEvent.requestPermission().then(result => {
            if(result === "granted"){
                gyroEnabled = true;
            }
        });
    } else {
        gyroEnabled = true;
    }
}

window.addEventListener("click", enableGyroscope, { once: true });

window.addEventListener("deviceorientation", (event) => {
    if(!gyroEnabled) return;
    const gamma = event.gamma || 0;
    player.rotation.y = -gamma * 0.02;
    camera.position.x = player.position.x + Math.sin(player.rotation.y) * 15;
    camera.position.z = player.position.z + Math.cos(player.rotation.y) * 15;
    camera.position.y = player.position.y + 8;
    camera.lookAt(player.position);
});

// =========================
// السماء والشمس والسحب
// =========================

const sky = new THREE.Mesh(
    new THREE.SphereGeometry(900, 64, 64),
    new THREE.MeshBasicMaterial({ color: 0x87CEEB, side: THREE.BackSide })
);
scene.add(sky);

const sunMesh = new THREE.Mesh(
    new THREE.SphereGeometry(12, 32, 32),
    new THREE.MeshBasicMaterial({ color: 0xffff66 })
);
sunMesh.position.set(180, 160, -250);
scene.add(sunMesh);

for(let i = 0; i < 40; i++){
    const cloud = new THREE.Mesh(
        new THREE.SphereGeometry(Math.random() * 5 + 5, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    cloud.position.set(
        (Math.random() - 0.5) * 700,
        Math.random() * 80 + 40,
        (Math.random() - 0.5) * 700
    );
    scene.add(cloud);
}

const stars = [];
for(let i = 0; i < 400; i++){
    const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    star.position.set(
        (Math.random() - 0.5) * 1800,
        Math.random() * 700 + 100,
        (Math.random() - 0.5) * 1800
    );
    scene.add(star);
    stars.push(star);
}

// =========================
// جبال وبحيرة
// =========================

for(let i = 0; i < 35; i++){
    const mountain = new THREE.Mesh(
        new THREE.ConeGeometry(Math.random() * 25 + 15, Math.random() * 70 + 40, 4),
        new THREE.MeshStandardMaterial({ color: 0x666666 })
    );
    mountain.position.set(
        (Math.random() - 0.5) * 900,
        20,
        (Math.random() - 0.5) * 900
    );
    mountain.castShadow = true;
    scene.add(mountain);
}

const lake = new THREE.Mesh(
    new THREE.CircleGeometry(45, 64),
    new THREE.MeshStandardMaterial({ color: 0x3ea6ff, transparent: true, opacity: 0.85 })
);
lake.rotation.x = -Math.PI / 2;
lake.position.set(120, 0.03, -80);
scene.add(lake);

// =========================
// حركة وحركة ناعمة
// =========================

let targetX = 0;
let targetZ = 0;

function movePlayer(){
    if(keys.forward) targetZ -= speed;
    if(keys.backward) targetZ += speed;
    if(keys.left) targetX -= speed;
    if(keys.right) targetX += speed;

    player.position.x += (targetX - player.position.x) * 0.15;
    player.position.z += (targetZ - player.position.z) * 0.15;
}

let worldTime = 0;
function updateWorld(){
    worldTime += 0.0015;
    sunMesh.position.x = Math.cos(worldTime) * 250;
    sunMesh.position.y = Math.sin(worldTime) * 220 + 60;
    sun.position.copy(sunMesh.position);

    const intensity = Math.max(0.15, Math.sin(worldTime) + 0.4);
    sun.intensity = intensity * 2;
    ambientLight.intensity = 0.35 + intensity;
    scene.background.setHSL(0.58, 0.6, 0.25 + intensity * 0.35);
}

// =========================
// المطر
// =========================

const rain = [];
const rainGeometry = new THREE.BoxGeometry(0.05, 0.7, 0.05);
const rainMaterial = new THREE.MeshBasicMaterial({ color: 0x66ccff });

for(let i = 0; i < 600; i++){
    const drop = new THREE.Mesh(rainGeometry, rainMaterial);
    drop.position.set(
        (Math.random() - 0.5) * 800,
        Math.random() * 250 + 20,
        (Math.random() - 0.5) * 800
    );
    scene.add(drop);
    rain.push(drop);
}

function updateStars(){
    for(const star of stars){
        star.rotation.y += 0.01;
    }
}

function updateRain(){
    for(const drop of rain){
        drop.position.y -= 3;
        if(drop.position.y < 0){
            drop.position.y = Math.random() * 200 + 150;
            drop.position.x = (Math.random() - 0.5) * 800;
            drop.position.z = (Math.random() - 0.5) * 800;
        }
    }
}

function updateRotation(){
    if(keys.forward) player.rotation.y = 0;
    if(keys.backward) player.rotation.y = Math.PI;
    if(keys.left) player.rotation.y = Math.PI / 2;
    if(keys.right) player.rotation.y = -Math.PI / 2;
}

// =========================
// واجهة FPS
// =========================

const fpsText = document.createElement("div");
fpsText.style.position = "absolute";
fpsText.style.top = "10px";
fpsText.style.right = "10px";
fpsText.style.color = "#00ff00";
fpsText.style.fontSize = "18px";
fpsText.style.fontFamily = "monospace";
document.body.appendChild(fpsText);

let lastTime = performance.now();
let frames = 0;

function updateFPS(){
    frames++;
    const now = performance.now();
    if(now - lastTime >= 1000){
        fpsText.innerHTML = "FPS : " + frames;
        frames = 0;
        lastTime = now;
    }
}

// =========================
// حدود العالم
// =========================

const worldSize = 470;
function worldLimits(){
    player.position.x = Math.max(-worldSize, Math.min(worldSize, player.position.x));
    player.position.z = Math.max(-worldSize, Math.min(worldSize, player.position.z));
}

// =========================
// Joystick
// =========================

const joystick = document.createElement("div");
joystick.style.position = "absolute";
joystick.style.left = "25px";
joystick.style.bottom = "25px";
joystick.style.width = "120px";
joystick.style.height = "120px";
joystick.style.borderRadius = "50%";
joystick.style.background = "rgba(255,255,255,.15)";
joystick.style.border = "2px solid white";
joystick.style.touchAction = "none";
document.body.appendChild(joystick);

const stick = document.createElement("div");
stick.style.position = "absolute";
stick.style.left = "35px";
stick.style.top = "35px";
stick.style.width = "50px";
stick.style.height = "50px";
stick.style.borderRadius = "50%";
stick.style.background = "#00ff88";
joystick.appendChild(stick);

let joyX = 0;
let joyY = 0;

joystick.addEventListener("pointermove", (e) => {
    if(e.buttons !== 1) return;
    const rect = joystick.getBoundingClientRect();
    const x = e.clientX - rect.left - 60;
    const y = e.clientY - rect.top - 60;
    const max = 35;
    joyX = Math.max(-1, Math.min(1, x / max));
    joyY = Math.max(-1, Math.min(1, y / max));
    stick.style.left = (35 + joyX * 35) + "px";
    stick.style.top = (35 + joyY * 35) + "px";
});

joystick.addEventListener("pointerup", () => {
    joyX = 0;
    joyY = 0;
    stick.style.left = "35px";
    stick.style.top = "35px";
});

function joystickMove(){
    player.position.x += joyX * speed;
    player.position.z += joyY * speed;
}

// =========================
// الطرق والبيوت والجسر
// =========================

const road = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 800),
    new THREE.MeshStandardMaterial({ color: 0x2b2b2b })
);
road.rotation.x = -Math.PI / 2;
road.position.y = 0.02;
scene.add(road);

for(let i = -390; i <= 390; i += 20){
    const line = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.03, i);
    scene.add(line);
}

function createHouse(x, z){
    const base = new THREE.Mesh(
        new THREE.BoxGeometry(8, 6, 8),
        new THREE.MeshStandardMaterial({ color: 0xd8b37a })
    );
    base.position.set(x, 3, z);
    base.castShadow = true;
    scene.add(base);

    const roof = new THREE.Mesh(
        new THREE.ConeGeometry(6, 4, 4),
        new THREE.MeshStandardMaterial({ color: 0xaa2222 })
    );
    roof.rotation.y = Math.PI / 4;
    roof.position.set(x, 8, z);
    roof.castShadow = true;
    scene.add(roof);
}

for(let i = 0; i < 18; i++){
    createHouse((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500);
}

const bridge = new THREE.Mesh(
    new THREE.BoxGeometry(18, 1, 70),
    new THREE.MeshStandardMaterial({ color: 0x7d5a3d })
);
bridge.position.set(120, 1, -80);
scene.add(bridge);

// =========================
// العملات والنقاط
// =========================

const coins = [];
function createCoin(x, z){
    const coin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.8, 0.8, 0.25, 24),
        new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xaa8800 })
    );
    coin.rotation.x = Math.PI / 2;
    coin.position.set(x, 2, z);
    scene.add(coin);
    coins.push(coin);
}

for(let i = 0; i < 40; i++){
    createCoin((Math.random() - 0.5) * 700, (Math.random() - 0.5) * 700);
}

let score = 0;
const scoreText = document.createElement("div");
scoreText.style.position = "absolute";
scoreText.style.left = "15px";
scoreText.style.top = "45px";
scoreText.style.color = "yellow";
scoreText.style.fontSize = "22px";
scoreText.innerHTML = "Coins : 0";
document.body.appendChild(scoreText);

function collectCoins(){
    for(let i = coins.length - 1; i >= 0; i--){
        const coin = coins[i];
        coin.rotation.y += 0.08;
        if(player.position.distanceTo(coin.position) < 3){
            scene.remove(coin);
            coins.splice(i, 1);
            score++;
            scoreText.innerHTML = "Coins : " + score;
        }
    }
}

// =========================
// السيارة والركوب
// =========================

const car = new THREE.Group();
const body = new THREE.Mesh(
    new THREE.BoxGeometry(4, 1.2, 7),
    new THREE.MeshStandardMaterial({ color: 0xff2222 })
);
body.position.y = 1.2;
car.add(body);

let driving = false;
window.addEventListener("keydown", (e) => {
    if(e.key === "e" || e.key === "E"){
        if(player.position.distanceTo(car.position) < 6){
            driving = !driving;
        }
    }
});

function updateCar(){
    if(!driving) return;
    if(keys.forward) car.position.z -= 0.45;
    if(keys.backward) car.position.z += 0.45;
    if(keys.left) car.position.x -= 0.45;
    if(keys.right) car.position.x += 0.45;

    player.position.copy(car.position);
    camera.position.set(car.position.x, car.position.y + 8, car.position.z + 15);
    camera.lookAt(car.position);
}

car.position.set(15, 0, -15);
scene.add(car);

// =========================
// القفز والركض والشريط
// =========================

let velocityY = 0;
let onGround = true;

window.addEventListener("keydown", (e) => {
    if(e.code === "Space" && onGround){
        velocityY = 0.35;
        onGround = false;
    }
    if(e.key === "Shift") running = true;
});

let running = false;
window.addEventListener("keyup", (e) => {
    if(e.key === "Shift") running = false;
});

function updateJump(){
    velocityY -= 0.015;
    player.position.y += velocityY;
    if(player.position.y <= 2){
        player.position.y = 2;
        velocityY = 0;
        onGround = true;
    }
}

function updateSpeed(){
    speed = running ? 0.45 : 0.25;
}

let health = 100;
const healthBox = document.createElement("div");
healthBox.style.position = "absolute";
healthBox.style.left = "15px";
healthBox.style.top = "80px";
healthBox.style.width = "220px";
healthBox.style.height = "20px";
healthBox.style.border = "2px solid white";
document.body.appendChild(healthBox);

const healthBar = document.createElement("div");
healthBar.style.width = "100%";
healthBar.style.height = "100%";
healthBar.style.background = "lime";
healthBox.appendChild(healthBar);

function updateHealth(){
    healthBar.style.width = health + "%";
    if(health > 60) healthBar.style.background = "lime";
    else if(health > 30) healthBar.style.background = "orange";
    else healthBar.style.background = "red";
}

// =========================
// نظام الطقس والعشب
// =========================

let weather = "sun";
function changeWeather(){
    const types = ["sun", "rain", "fog"];
    weather = types[Math.floor(Math.random() * types.length)];
}
setInterval(changeWeather, 30000);

function updateWeather(){
    if(weather === "sun"){
        scene.fog.near = 80;
        scene.fog.far = 450;
        rain.forEach(r => r.visible = false);
    } else if(weather === "rain"){
        scene.fog.near = 40;
        scene.fog.far = 250;
        rain.forEach(r => r.visible = true);
    } else if(weather === "fog"){
        scene.fog.near = 15;
        scene.fog.far = 120;
        rain.forEach(r => r.visible = false);
    }
}

const grass = [];
for(let i = 0; i < 800; i++){
    const blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, 0.6 + Math.random() * 0.5, 0.08),
        new THREE.MeshStandardMaterial({ color: 0x2ecc71 })
    );
    blade.position.set(
        (Math.random() - 0.5) * 900,
        0.3,
        (Math.random() - 0.5) * 900
    );
    scene.add(blade);
    grass.push(blade);
}

function animateGrass(){
    const t = performance.now() * 0.002;
    grass.forEach((g, i) => {
        g.rotation.z = Math.sin(t + i) * 0.12;
    });
}

const mission = document.createElement("div");
mission.style.position = "absolute";
mission.style.left = "15px";
mission.style.bottom = "15px";
mission.style.color = "white";
mission.style.fontSize = "18px";
mission.innerHTML = "Mission : Collect 20 Coins";
document.body.appendChild(mission);

function updateMission(){
    if(score >= 20){
        mission.innerHTML = "Mission Complete ✔";
    }
}

// =========================
// الحلقة الرئيسية المشتركة
// =========================

function animate(){
    requestAnimationFrame(animate);

    movePlayer();
    joystickMove();
    updateRotation();
    if(!driving) updateCamera();

    updateRain();
    updateStars();
    updateWorld();
    updateJump();
    updateSpeed();
    updateWeather();
    animateGrass();
    collectCoins();
    updateCar();
    updateMission();
    updateHealth();
    worldLimits();
    updateFPS();

    renderer.render(scene, camera);
}

// إخفاء شاشة التحميل وبدء اللعبة
const loading = document.getElementById("loading");
if(loading) loading.style.display = "none";

animate();

// إعادة ضبط الحجم مع نافذة المتصفح
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
