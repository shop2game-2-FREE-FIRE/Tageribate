<script type="module">

import * as THREE from "three";

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87ceeb);

const camera=new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
2000
);

const renderer=new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

// =========================
// الإضاءة
// =========================

const ambientLight = new THREE.AmbientLight(0xffffff,1);
scene.add(ambientLight);

const sun = new THREE.DirectionalLight(0xffffff,2);

sun.position.set(120,200,100);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);

// =========================
// الضباب
// =========================

scene.fog = new THREE.Fog(0x87ceeb,80,450);

// =========================
// الأرض
// =========================

const groundGeometry = new THREE.PlaneGeometry(1000,1000);

const groundMaterial = new THREE.MeshStandardMaterial({
    color:0x3f9b3f
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);

// =========================
// اللاعب
// =========================

const player = new THREE.Mesh(

new THREE.BoxGeometry(2,4,2),

new THREE.MeshStandardMaterial({
    color:0x2196f3
})

);

player.position.y=2;

player.castShadow=true;

scene.add(player);

// =========================
// الكاميرا
// =========================

camera.position.set(0,8,15);

camera.lookAt(player.position);

// =========================
// تحديث الكاميرا
// =========================

function updateCamera(){

camera.position.x = player.position.x;

camera.position.z = player.position.z + 15;

camera.position.y = player.position.y + 8;

camera.lookAt(player.position);

}
   // =========================
// متغيرات الحركة
// =========================

const keys = {
    forward:false,
    backward:false,
    left:false,
    right:false
};

const speed = 0.25;

// لوحة المفاتيح

window.addEventListener("keydown",(e)=>{

if(e.key==="w"||e.key==="ArrowUp") keys.forward=true;

if(e.key==="s"||e.key==="ArrowDown") keys.backward=true;

if(e.key==="a"||e.key==="ArrowLeft") keys.left=true;

if(e.key==="d"||e.key==="ArrowRight") keys.right=true;

});

window.addEventListener("keyup",(e)=>{

if(e.key==="w"||e.key==="ArrowUp") keys.forward=false;

if(e.key==="s"||e.key==="ArrowDown") keys.backward=false;

if(e.key==="a"||e.key==="ArrowLeft") keys.left=false;

if(e.key==="d"||e.key==="ArrowRight") keys.right=false;

});

// =========================
// أشجار تلقائية
// =========================

function createTree(x,z){

const trunk=new THREE.Mesh(

new THREE.CylinderGeometry(0.4,0.6,3,8),

new THREE.MeshStandardMaterial({
color:0x7b4a12
})

);

trunk.position.set(x,1.5,z);

trunk.castShadow=true;

scene.add(trunk);

const leaves=new THREE.Mesh(

new THREE.SphereGeometry(2,16,16),

new THREE.MeshStandardMaterial({
color:0x228B22
})

);

leaves.position.set(x,4.5,z);

leaves.castShadow=true;

scene.add(leaves);

}

for(let i=0;i<120;i++){

const x=(Math.random()-0.5)*900;

const z=(Math.random()-0.5)*900;

createTree(x,z);

}

// =========================
// صخور
// =========================

for(let i=0;i<80;i++){

const rock=new THREE.Mesh(

new THREE.DodecahedronGeometry(
Math.random()*1.5+0.5
),

new THREE.MeshStandardMaterial({
color:0x888888
})

);

rock.position.set(

(Math.random()-0.5)*900,

1,

(Math.random()-0.5)*900

);

rock.castShadow=true;

scene.add(rock);

}

// =========================
// الحلقة الرئيسية
// =========================

function animate(){

requestAnimationFrame(animate);

if(keys.forward) player.position.z-=speed;

if(keys.backward) player.position.z+=speed;

if(keys.left) player.position.x-=speed;

if(keys.right) player.position.x+=speed;

updateCamera();

renderer.render(scene,camera);

}

animate();

document.getElementById("loading").style.display="none";

window.addEventListener("resize",()=>{

camera.aspect=window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});
 // =========================
// التحكم بحركة الهاتف
// =========================

let gyroEnabled = false;

function enableGyroscope(){

if(typeof DeviceOrientationEvent!=="undefined"
&&
typeof DeviceOrientationEvent.requestPermission==="function"){

DeviceOrientationEvent.requestPermission().then(result=>{

if(result==="granted"){

gyroEnabled=true;

}

});

}else{

gyroEnabled=true;

}

}

window.addEventListener("click",enableGyroscope,{once:true});

window.addEventListener("deviceorientation",(event)=>{

if(!gyroEnabled) return;

const gamma=event.gamma||0;
const beta=event.beta||0;

player.rotation.y=-gamma*0.02;

camera.position.x=player.position.x+Math.sin(player.rotation.y)*15;

camera.position.z=player.position.z+Math.cos(player.rotation.y)*15;

camera.position.y=player.position.y+8;

camera.lookAt(player.position);

});

// =========================
// السماء
// =========================

const sky=new THREE.Mesh(

new THREE.SphereGeometry(900,64,64),

new THREE.MeshBasicMaterial({

side:THREE.BackSide

);

// =========================

sunMesh.position.set(180,160,-250);

  // =========================

for(let i=0;i<35;i++){

const mountain=new THREE.Mesh(

// =========================
// بحيرة
// =========================

new THREE.CircleGeometry(45,64),

// =========================
// دورة الليل والنهار
// =========================

let worldTime=0;

// =========================
// حركة ناعمة
// =========================

let targetX=0;
let targetZ=0;

function movePlayer(){

if(keys.forward) targetZ-=speed;

if(keys.backward) targetZ+=speed;

if(keys.left) targetX-=speed;

if(keys.right) targetX+=speed;

player.position.x+=(targetX-player.position.x)*0.15;

player.position.z+=(targetZ-player.position.z)*0.15;

}

// =========================
// تحديث العالم
// =========================

function updateWorld(){

worldTime+=0.0015;

sunMesh.position.x=Math.cos(worldTime)*250;

sunMesh.position.y=Math.sin(worldTime)*220+60;

sun.position.copy(sunMesh.position);

const intensity=Math.max(
0.15,
Math.sin(worldTime)+0.4
);

sun.intensity=intensity*2;

ambientLight.intensity=0.35+intensity;

scene.background.setHSL(
0.58,
0.6,
0.25+intensity*0.35
);

}
// =========================
// المطر
// =========================

const rain = [];

const rainGeometry = new THREE.BoxGeometry(0.05,0.7,0.05);
const rainMaterial = new THREE.MeshBasicMaterial({
    color:0x66ccff
});

for(let i=0;i<600;i++){

    const drop = new THREE.Mesh(
        rainGeometry,
        rainMaterial
    );

    drop.position.set(
        (Math.random()-0.5)*800,
        Math.random()*250+20,
        (Math.random()-0.5)*800
    );

    scene.add(drop);

    rain.push(drop);

}

// =========================
// نجوم متحركة
// =========================

function updateStars(){

    for(const star of stars){

        star.rotation.y += 0.01;

    }

}

// =========================
// تحديث المطر
// =========================

function updateRain(){

    for(const drop of rain){

        drop.position.y -= 3;

        if(drop.position.y < 0){

            drop.position.y = Math.random()*200+150;

            drop.position.x =
            (Math.random()-0.5)*800;

            drop.position.z =
            (Math.random()-0.5)*800;

        }

    }

}

// =========================
// دوران اللاعب حسب الاتجاه
// =========================

function updateRotation(){

    if(keys.forward)
        player.rotation.y=0;

    if(keys.backward)
        player.rotation.y=Math.PI;

    if(keys.left)
        player.rotation.y=Math.PI/2;

    if(keys.right)
        player.rotation.y=-Math.PI/2;

}

// =========================
// واجهة FPS
// =========================

const fpsText=document.createElement("div");

fpsText.style.position="absolute";
fpsText.style.top="10px";
fpsText.style.right="10px";
fpsText.style.color="#00ff00";
fpsText.style.fontSize="18px";
fpsText.style.fontFamily="monospace";

document.body.appendChild(fpsText);

let lastTime=performance.now();

let frames=0;

function updateFPS(){

    frames++;

    const now=performance.now();

    if(now-lastTime>=1000){

        fpsText.innerHTML="FPS : "+frames;

        frames=0;

        lastTime=now;

    }

}

// =========================
// حدود العالم

const worldSize=470;

function worldLimits(){

player.position.x=Math.max(
-worldSize,
Math.min(worldSize,player.position.x)
);

player.position.z=Math.max(
-worldSize,
Math.min(worldSize,player.position.z)

   // =========================
// عصا تحكم للهاتف (Joystick)
// =========================

const joystick=document.createElement("div");

joystick.style.position="absolute";
joystick.style.left="25px";
joystick.style.bottom="25px";
joystick.style.width="120px";
joystick.style.height="120px";
joystick.style.borderRadius="50%";
joystick.style.background="rgba(255,255,255,.15)";
joystick.style.border="2px solid white";
joystick.style.touchAction="none";

document.body.appendChild(joystick);

const stick=document.createElement("div");

stick.style.position="absolute";
stick.style.left="35px";
stick.style.top="35px";
stick.style.width="50px";
stick.style.height="50px";
stick.style.borderRadius="50%";
stick.style.background="#00ff88";

joystick.appendChild(stick);

let joyX=0;
let joyY=0;

joystick.addEventListener("pointermove",(e)=>{

if(e.buttons!==1)return;

const rect=joystick.getBoundingClientRect();

const x=e.clientX-rect.left-60;

const y=e.clientY-rect.top-60;

const max=35;

joyX=Math.max(-1,Math.min(1,x/max));
joyY=Math.max(-1,Math.min(1,y/max));

stick.style.left=(35+joyX*35)+"px";
stick.style.top=(35+joyY*35)+"px";

});

joystick.addEventListener("pointerup",()=>{

joyX=0;
joyY=0;

stick.style.left="35px";
stick.style.top="35px";

});

function joystickMove(){

player.position.x+=joyX*speed;

player.position.z+=joyY*speed;

}

function collectCoins(){

for(let i=coins.length-1;i>=0;i--){

const coin=coins[i];

coin.rotation.y+=0.08;

if(player.position.distanceTo(coin.position)<3){

scene.remove(coin);

coins.splice(i,1);

score++;

scoreText.innerHTML="Coins : "+score;

}

}

}

function saveGame(){

localStorage.setItem(

"playerX",

player.position.x

);

localStorage.setItem(

"playerZ",

player.position.z

);

}

function loadGame(){

const x=localStorage.getItem("playerX");

const z=localStorage.getItem("playerZ");

if(x!==null){

player.position.x=parseFloat(x);

}

if(z!==null){

player.position.z=parseFloat(z);

}

}

// =========================

let weather="sun";

function changeWeather(){

const types=["sun","rain","fog"];

weather=types[Math.floor(Math.random()*types.length)];

}

setInterval(changeWeather,30000);

function updateWeather(){

if(weather==="sun"){

scene.fog.near=80;
scene.fog.far=450;

rain.forEach(r=>r.visible=false);

renderer.setClearColor(0x87ceeb);

}

if(weather==="rain"){

scene.fog.near=40;
scene.fog.far=250;

rain.forEach(r=>r.visible=true);

renderer.setClearColor(0x5d6d7e);

}

if(weather==="fog"){

scene.fog.near=15;
scene.fog.far=120;

rain.forEach(r=>r.visible=false);

renderer.setClearColor(0xbfc9ca);

}

}

// عشب

const grass=[];

for(let i=0;i<800;i++){

const blade=new THREE.Mesh(

new THREE.BoxGeometry(
0.08,
0.6+Math.random()*0.5,
0.08
),

new THREE.MeshStandardMaterial({

color:0x2ecc71

})

);

blade.position.set(

(Math.random()-0.5)*900,

0.3,

(Math.random()-0.5)*900

);

scene.add(blade);

grass.push(blade);

}

function animateGrass(){

const t=performance.now()*0.002;

grass.forEach((g,i)=>{

g.rotation.z=Math.sin(t+i)*0.12;

});

}

function rotateCarWheels(){

if(!driving)return;

car.children.forEach(obj=>{

if(obj.geometry&&obj.geometry.type==="CylinderGeometry"){

obj.rotation.x+=0.25;

}

});

}

// =========================
// اصطدام بالمنازل
// =========================

function collideHouse(){

scene.children.forEach(obj=>{

if(obj.geometry&&obj.geometry.type==="BoxGeometry"){

const d=obj.position.distanceTo(player.position);

if(d<4){

player.position.x-=Math.sin(player.rotation.y);

player.position.z-=Math.cos(player.rotation.y);

}

}

});

}
